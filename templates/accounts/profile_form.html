{% extends "base.html" %}
{% block title %}Modifier le profil · DevDesk{% endblock %}
{% block content %}
<div class="page-head"><h1>Modifier le profil</h1></div>
<div class="panel form-panel">
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>{% endif %}
        </div>
        {% endfor %}
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{% url 'accounts:profile' %}">Annuler</a>
    </form>
</div>
{% endblock %}
