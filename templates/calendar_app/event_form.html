{% extends "base.html" %}
{% block title %}Événement · DevDesk{% endblock %}
{% block content %}
<div class="page-head"><h1>{% if object %}Modifier l'événement{% else %}Nouvel événement{% endif %}</h1></div>
<div class="panel form-panel">
    <form method="post">{% csrf_token %}{% include "includes/form.html" %}
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{% url 'calendar_app:month' %}">Annuler</a>
    </form>
</div>
{% endblock %}
