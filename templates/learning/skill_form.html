{% extends "base.html" %}
{% block title %}Compétence · DevDesk{% endblock %}
{% block content %}
<div class="page-head"><h1>{% if object %}Modifier la compétence{% else %}Nouvelle compétence{% endif %}</h1></div>
<div class="panel form-panel">
    <form method="post">{% csrf_token %}{% include "includes/form.html" %}
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{% url 'learning:home' %}">Annuler</a>
    </form>
</div>
{% endblock %}
