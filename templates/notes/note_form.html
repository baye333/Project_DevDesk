{% extends "base.html" %}
{% block title %}Note · DevDesk{% endblock %}
{% block content %}
<div class="page-head"><h1>{% if object %}Modifier la note{% else %}Nouvelle note{% endif %}</h1></div>
<div class="panel form-panel">
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form.html" %}
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{% url 'notes:list' %}">Annuler</a>
    </form>
</div>
{% endblock %}
