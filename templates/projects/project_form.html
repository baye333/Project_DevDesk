{% extends "base.html" %}
{% block title %}Projet · DevDesk{% endblock %}
{% block content %}
<div class="page-head"><h1>{% if object %}Modifier le projet{% else %}Nouveau projet{% endif %}</h1></div>
<div class="panel form-panel">
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form.html" %}
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{% url 'projects:list' %}">Annuler</a>
    </form>
</div>
{% endblock %}
