{% extends "base.html" %}
{% block title %}Supprimer · DevDesk{% endblock %}
{% block content %}
<div class="panel form-panel">
    <h1 class="h4">Supprimer « {{ object.title }} » ?</h1>
    <form method="post">{% csrf_token %}
        <button class="btn btn-danger" type="submit">Supprimer</button>
        <a class="btn btn-outline-secondary" href="{{ object.get_absolute_url }}">Annuler</a>
    </form>
</div>
{% endblock %}
